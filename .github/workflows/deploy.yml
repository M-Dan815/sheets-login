name: Deploy Backend

on:
  push:
    branches:
      - main # deploy only on main branch

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Backend
        uses: actions/checkout@v3

      - name: Set up SSH key
        uses: webfactory/ssh-agent@v0.8
        with:
          ssh-private-key: ${{ secrets.DROPLET_SSH_KEY }}

      - name: Build Docker image
        run: |
          docker build -t backend-app .

      - name: Save Docker image as tar
        run: |
          docker save backend-app | gzip > backend-app.tar.gz

      - name: Copy image to droplet
        run: |
          scp -o StrictHostKeyChecking=no backend-app.tar.gz root@${{ secrets.DROPLET_IP }}:${{ secrets.APP_PATH }}/

      - name: Deploy Docker container
        run: |
          ssh -o StrictHostKeyChecking=no root@${{ secrets.DROPLET_IP }} << 'EOF'
            cd $APP_PATH
            docker load < backend-app.tar.gz
            docker stop backend || true
            docker rm backend || true
            docker run -d --name backend -p 4000:4000 --restart unless-stopped backend-app
          EOF
